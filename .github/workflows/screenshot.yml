name: 3D ekran goruntusu al

# Oyunu sanal ekranda (xvfb + yazilimsal GL) calistirir, birkac saniye
# sonra ekran goruntusunu docs/screens/3d.png olarak repoya commit'ler.
# Boylece gorseller telefona build gitmeden kontrol edilebilir.

# AGIR/GORSEL KATMAN. Her push'ta KOSMAZ (hizli katman ci-fast.yml'de):
# yalniz PR'da ve elle tetiklendiginde. Bkz. RAPOR_CI.md.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/**"
      - "assets/**"
      - "project.godot"
      - "*.tscn"

env:
  GODOT_TAG: "4.7-stable"

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Godot editor indir
        run: |
          set -e
          mkdir -p /opt/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /opt/godot/editor
          GODOT_BIN=$(find /opt/godot/editor -maxdepth 2 -type f -name 'Godot_*')
          chmod +x "$GODOT_BIN"
          mv "$GODOT_BIN" /opt/godot/godot

      - name: Sanal ekran kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Import onbellegi
        uses: actions/cache@v4
        with:
          # HEM .godot HEM assetlerin yanindaki .import dosyalari.
          # ILK DENEMEDE yalniz .godot onbelleklendi ve ICE AKTARMA
          # HIC HIZLANMADI (olculdu: onbellek 4 sn'de geri geldi, ice
          # aktarma yine 164 sn). Sebep: bu repoda assets/ altinda
          # commit'lenmis .import dosyasi YOK (459 asset, 0 .import) ve
          # .import dosyalari .godot'nun ICINDE DEGIL, asset'in yaninda
          # duruyor. Onlar olmadan Godot her seferinde her seyi bastan
          # ice aktariyor.
          path: |
            .godot
            assets/**/*.import
          # Assetler degismediyse ice aktarma neredeyse bedava (bu adim
          # olcumde ~190 sn ile en pahali IKINCI adimdi).
          key: godot-import-${{ env.GODOT_TAG }}-${{ hashFiles('assets/**', 'project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_TAG }}-

      - name: Projeyi ice aktar
        run: /opt/godot/godot --headless --import --path "$GITHUB_WORKSPACE" || true

      # COZUNURLUK: 1280x720 -> 960x540. Kareler gorsel karar icin
      # bakiliyor, piksel karsilastirmasi yapilmiyor; 960x540 bunun icin
      # yeterli ve islenen piksel %44 azaliyor. xvfb ekrani DEGIL,
      # --resolution onemli: kare get_viewport()'tan aliniyor, ekran
      # boyutundan degil (xvfb'yi kucultmek tek basina hicbir sey
      # kazandirmazdi).
      - name: Oyunu calistir ve goruntu al
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docs/screens"
          RABLE_SCREENSHOT="$GITHUB_WORKSPACE/docs/screens/3d.png" timeout 480 \
            xvfb-run -a -s "-screen 0 960x540x24" \
            /opt/godot/godot --path "$GITHUB_WORKSPACE" --rendering-driver opengl3 \
            --resolution 960x540 \
            > /tmp/game.log 2>&1 || true
          echo "=== OYUN LOGU (script hatalari dahil, son 150 satir) ==="
          tail -150 /tmp/game.log
          ls -la "$GITHUB_WORKSPACE/docs/screens" | head -5

      - name: Goruntuyu commit'le
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screens
          git commit -m "3D ekran goruntusu (otomatik)" || echo "degisiklik yok"
          git push
